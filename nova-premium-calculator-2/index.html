<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="A sleek, responsive calculator with keyboard support and live results." />
  <title>Smart Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Nova calculator home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>CALCULATOR</span>
      </a>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">Numbers, <span>made simple.</span></h1>
    </section>

    <section class="calculator" aria-label="Calculator">
      <div class="display" aria-live="polite" aria-atomic="true">
        <div class="display-meta">
          <span id="mode-label">LIVE RESULT</span>
        </div>
        <div id="expression" class="expression" aria-label="Current expression">0</div>
        <div id="result" class="result">0</div>
        <div id="display-message" class="display-message"></div>
      </div>

      <div class="keypad" role="group" aria-label="Calculator keys">
        <button class="key key-function" data-action="clear" type="button">AC</button>
        <button class="key key-function" data-action="sign" type="button" aria-label="Toggle sign">+/−</button>
        <button class="key key-function" data-action="backspace" type="button" aria-label="Backspace">⌫</button>
        <button class="key key-operator" data-value="÷" type="button" aria-label="Divide">÷</button>

        <button class="key" data-value="7" type="button">7</button>
        <button class="key" data-value="8" type="button">8</button>
        <button class="key" data-value="9" type="button">9</button>
        <button class="key key-operator" data-value="×" type="button" aria-label="Multiply">×</button>

        <button class="key" data-value="4" type="button">4</button>
        <button class="key" data-value="5" type="button">5</button>
        <button class="key" data-value="6" type="button">6</button>
        <button class="key key-operator" data-value="−" type="button" aria-label="Subtract">−</button>

        <button class="key" data-value="1" type="button">1</button>
        <button class="key" data-value="2" type="button">2</button>
        <button class="key" data-value="3" type="button">3</button>
        <button class="key key-operator" data-value="+" type="button" aria-label="Add">+</button>

        <button class="key key-zero" data-value="0" type="button">0</button>
        <button class="key" data-value="." type="button" aria-label="Decimal point">.</button>
        <button class="key key-equals" data-action="equals" type="button" aria-label="Equals">=</button>
      </div>
      <div class="calculator-foot">
        <span><kbd>Enter</kbd> calculate</span>
        <span><kbd>Esc</kbd> clear</span>
        <span><kbd>⌫</kbd> delete</span>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
